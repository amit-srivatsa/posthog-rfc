<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFC: Hire Amit</title>
<meta name="description" content="An application for PostHog's Developer Marketer (Sales) role, written as an RFC, with a battlecard as proof of work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eeefe9;
    --panel: #fdfdf8;
    --ink: #151515;
    --muted: #5b5b55;
    --rule: #d4d4cb;
    --accent: #e0592a;
    --accent-ink: #ffffff;
    --link: #b83f12;
    --code-bg: #e5e5dc;
    --quote-bg: #fff4e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a;
      --panel: #1f2023;
      --ink: #eeeeea;
      --muted: #a3a39b;
      --rule: #34353a;
      --accent: #f0703f;
      --accent-ink: #111111;
      --link: #f59a72;
      --code-bg: #2a2b2f;
      --quote-bg: #2a2219;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --panel: #1f2023; --ink: #eeeeea; --muted: #a3a39b; --rule: #34353a;
    --accent: #f0703f; --accent-ink: #111111; --link: #f59a72; --code-bg: #2a2b2f; --quote-bg: #2a2219;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 "IBM Plex Sans", system-ui, sans-serif;
  }
  a { color: var(--link); }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  .brand { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 14px; }
  .brand b { color: var(--accent); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs a, .tabs button {
    font: 500 13px/1 "IBM Plex Mono", monospace; text-decoration: none; color: var(--ink);
    border: 1px solid var(--rule); background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .wrap { max-width: 820px; margin: 24px auto 64px; padding: 0 16px; }
  article {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
    padding: 28px 32px; overflow-wrap: anywhere;
  }
  @media (max-width: 600px) { article { padding: 20px 16px; } }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 16px; }
  h2 { font-size: 21px; margin: 36px 0 10px; padding-top: 12px; border-top: 1px solid var(--rule); }
  h3 { font-size: 17px; margin: 24px 0 6px; }
  hr + h2 { border-top: 0; padding-top: 0; }
  hr { border: 0; border-top: 1px dashed var(--rule); margin: 24px 0; }
  blockquote { margin: 16px 0; padding: 10px 16px; background: var(--quote-bg); border-left: 4px solid var(--accent); border-radius: 4px; }
  blockquote p { margin: 4px 0; }
  code { font-family: "IBM Plex Mono", monospace; font-size: 0.9em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .table-scroll { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  ul.contains-task-list { list-style: none; padding-left: 4px; }
  li input[type="checkbox"] { margin-right: 6px; }
  .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; font-family: "IBM Plex Mono", monospace; }
  .loading { color: var(--muted); font-family: "IBM Plex Mono", monospace; }
</style>
</head>
<body>
  <header class="bar">
    <div class="brand">requests-for-<b>hiring</b> / amit</div>
    <nav class="tabs">
      <a href="#README.md" data-doc="README.md">RFC</a>
      <a href="#battlecard-ai-observability.md" data-doc="battlecard-ai-observability.md">Battlecard</a>
      <a href="https://github.com/amit-srivatsa/posthog-rfc">Repo</a>
      <button id="theme" type="button" aria-label="Toggle theme">◐</button>
    </nav>
  </header>
  <main class="wrap">
    <article id="doc"><p class="loading">Loading markdown. Nothing gets shipped in a meeting, but this takes a second.</p></article>
    <p class="foot">Plain markdown in a public repo, rendered on the fly. Read the source on GitHub.</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    const DOCS = ["README.md", "battlecard-ai-observability.md"];
    const el = document.getElementById("doc");

    function current() {
      const h = decodeURIComponent(location.hash.slice(1));
      return DOCS.includes(h) ? h : "README.md";
    }

    async function render() {
      const name = current();
      document.querySelectorAll(".tabs a[data-doc]").forEach(a =>
        a.dataset.doc === name ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
      try {
        const res = await fetch(name, { cache: "no-cache" });
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();
        el.innerHTML = marked.parse(md, { gfm: true, breaks: false });
        el.querySelectorAll("table").forEach(t => {
          const w = document.createElement("div"); w.className = "table-scroll";
          t.parentNode.insertBefore(w, t); w.appendChild(t);
        });
        el.querySelectorAll("a[href]").forEach(a => {
          const href = a.getAttribute("href").replace(/^\.\//, "");
          if (DOCS.includes(href)) { a.setAttribute("href", "#" + href); }
          else if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
        });
        const h1 = el.querySelector("h1");
        if (h1) document.title = h1.textContent.slice(0, 60);
        window.scrollTo(0, 0);
      } catch (e) {
        el.innerHTML = '<p>Could not load <code>' + name + '</code>. Read it on <a href="https://github.com/amit-srivatsa/posthog-rfc/blob/main/' + name + '">GitHub</a> instead.</p>';
      }
    }

    document.getElementById("theme").addEventListener("click", () => {
      const root = document.documentElement;
      const dark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
